name: Daily Klaviyo refresh

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Klaviyo stats
        env:
          KLAVIYO_API_KEY: ${{ secrets.KLAVIYO_API_KEY }}
        run: python3 scripts/update_klaviyo.py
      - name: Commit if changed
        run: |
          git config user.name "loop8-dashboard"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --staged --quiet; then
            echo "No stat changes"
          else
            git commit -m "Update daily Loop8 stats"
            git push
          fi
